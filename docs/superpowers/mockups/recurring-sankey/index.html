<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recurring Sankey — production preview (chartjs-chart-sankey)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.14.1/dist/chartjs-chart-sankey.min.js"></script>
<style>
  :root{
    --bg:#0a0e1a; --card:#0e1422; --border:#1e293b;
    --text:#e2e8f0; --muted:#94a3b8; --income:#10e5a0; --expense:#f87171; --accent:#2dd4bf;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);padding:28px;}
  .wrap{max-width:1000px;margin-inline:auto;}
  h1{font-size:1.6rem;font-weight:700;margin:0;}
  .sub{color:var(--muted);font-size:.85rem;margin:4px 0 22px;}

  .summary-row{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .summary-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;flex:1;min-width:200px;display:flex;align-items:center;gap:14px;}
  .sc-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .sc-icon.income{background:rgba(16,229,160,.12);}
  .sc-icon.expense{background:rgba(248,113,113,.12);}
  .sc-label{font-size:.72rem;color:var(--muted);display:block;}
  .sc-amount{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .sc-amount.income{color:var(--income);}
  .sc-amount.expense{color:var(--expense);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;}
  .rp-flow-panel{margin-bottom:16px;padding:18px 16px 12px;}
  .rp-flow-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;padding:0 4px;}
  .rp-flow-title{font-size:1rem;font-weight:600;color:var(--text);}
  .rp-flow-sub{font-size:.75rem;color:var(--muted);}
  .rp-flow-canvas-wrap{position:relative;height:320px;width:100%;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Recurring Payments</h1>
  <div class="sub">Manage your scheduled income and expenses</div>

  <div class="summary-row">
    <div class="summary-card">
      <div class="sc-icon income">📈</div>
      <div><span class="sc-label">Monthly Scheduled Income</span><span class="sc-amount income">$3,800.00</span></div>
    </div>
    <div class="summary-card">
      <div class="sc-icon expense">🏦</div>
      <div><span class="sc-label">Monthly Scheduled Expenses</span><span class="sc-amount expense">$1,895.00</span></div>
    </div>
  </div>

  <div class="card rp-flow-panel">
    <div class="rp-flow-head">
      <span class="rp-flow-title">Cash-flow overview</span>
      <span class="rp-flow-sub">band width = monthly amount</span>
    </div>
    <div class="rp-flow-canvas-wrap"><canvas id="flow"></canvas></div>
  </div>
</div>

<script>
// Mirrors the production component: namespaced in:/out: keys, hub + savings, category colors.
const HUB='hub', SAV='sav', HUB_COLOR='#14b8a6', SAV_COLOR='#34d399';
const catColor = { housing:'#38bdf8', transport:'#fb923c', health:'#a78bfa',
                   entertainment:'#f472b6', salary:'#10e5a0', other:'#94a3b8', gym:'#06b6d4' };

const income = [
  {id:'i1', transactionName:'salary',    category:'salary', amount:3000},
  {id:'i2', transactionName:'freelance', category:'salary', amount:800},
];
const expense = [
  {id:'e1', transactionName:'rent',            category:'housing',       amount:1200},
  {id:'e2', transactionName:'car payment',     category:'transport',     amount:350},
  {id:'e3', transactionName:'health insurance',category:'health',        amount:200},
  {id:'e4', transactionName:'subscriptions',   category:'entertainment', amount:35},
  {id:'e5', transactionName:'gym',             category:'gym',           amount:50},
  {id:'e6', transactionName:'phone',           category:'other',         amount:60},
];
const titleCase = s => s.replace(/\b\w/g, c => c.toUpperCase());
const totalIn = income.reduce((s,r)=>s+r.amount,0);
const totalOut= expense.reduce((s,r)=>s+r.amount,0);
const surplus = totalIn-totalOut;

const data=[]; const labels={[HUB]:'Monthly Income',[SAV]:'Savings'}; const colors={[HUB]:HUB_COLOR,[SAV]:SAV_COLOR};
income.forEach(r=>{const k='in:'+r.id; data.push({from:k,to:HUB,flow:r.amount}); labels[k]=titleCase(r.transactionName); colors[k]=catColor[r.category]||'#94a3b8';});
expense.forEach(r=>{const k='out:'+r.id; data.push({from:HUB,to:k,flow:r.amount}); labels[k]=titleCase(r.transactionName); colors[k]=catColor[r.category]||'#94a3b8';});
if(surplus>0) data.push({from:HUB,to:SAV,flow:surplus});
const nodeColor = n => colors[n] ?? '#94a3b8';

new Chart(document.getElementById('flow'), {
  type:'sankey',
  data:{ datasets:[{
    data, labels,
    colorFrom:(c)=>nodeColor(c.dataset.data[c.dataIndex].from),
    colorTo:(c)=>nodeColor(c.dataset.data[c.dataIndex].to),
    colorMode:'gradient', borderWidth:0, nodeWidth:14, nodePadding:14,
  }]},
  options:{ responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false},
      tooltip:{ backgroundColor:'#0e1726', borderColor:'rgba(255,255,255,0.08)', borderWidth:1,
        titleColor:'#94a3b8', bodyColor:'#e2e8f0',
        callbacks:{ label:(ctx)=>{const d=ctx.dataset.data[ctx.dataIndex];return (labels[d.from]??d.from)+' → '+(labels[d.to]??d.to)+': $'+d.flow.toLocaleString();}}}}}
});
</script>
</body>
</html>
