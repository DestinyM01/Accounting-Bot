name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: jobs only read the repo unless they say otherwise.
permissions:
  contents: read

# One run at a time, oldest first, so an older run can never push :latest after a newer one.
concurrency:
  group: docker-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ── Gate: nothing is pushed unless the api's tests and type check pass ──────
  test:
    name: "1 · Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@12.6.0

      - name: Install api dependencies
        working-directory: api
        run: pnpm install --frozen-lockfile

      - name: Run api tests
        working-directory: api
        run: pnpm test

      - name: Type-check api
        working-directory: api
        run: npx tsc --noEmit -p tsconfig.json

  # ── API image ───────────────────────────────────────────────────────────────
  build-api:
    name: "2 · API"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "API_IMAGE=${IMAGE,,}" >> $GITHUB_ENV
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/accounting-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.API_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.API_IMAGE }}:buildcache,mode=max
          provenance: false

  # ── Web image ───────────────────────────────────────────────────────────────
  build-web:
    name: "3 · Web"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "WEB_IMAGE=${IMAGE,,}" >> $GITHUB_ENV
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/accounting-web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache,mode=max
          provenance: false
