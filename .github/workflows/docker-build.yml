name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/accounting-bot

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR requires fully lowercase image names; github.repository_owner
      # preserves the original casing (e.g. DestinyM01) which causes a build
      # error. This step rewrites IMAGE_NAME in $GITHUB_ENV so all subsequent
      # steps pick up the lowercase version automatically.
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      # Buildx gives us layer caching and multi-platform support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatically provided, no extra setup

      # Produces image tags and OCI labels from git metadata
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # :latest on every push to main
            type=raw,value=latest,enable={{is_default_branch}}
            # :sha-<short-sha> for traceability (useful for ArgoCD image updater)
            type=sha,prefix=sha-

      # The Dockerfile lives in repo/ — context and file must point there
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./repo
          file: ./repo/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-based cache persists across runners and workflow runs.
          # Uses a dedicated :buildcache tag so it doesn't pollute :latest.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: false   # skip SBOM attestation (reduces image manifest complexity)
