name: Deploy to Proxmox

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        working-directory: /opt/accbot/Accounting-Bot

    steps:
      - name: Mark repo as safe for git
        run: git config --global --add safe.directory /opt/accbot/Accounting-Bot

      - name: Pull latest code
        run: git pull origin main

      - name: Rebuild and restart bot
        run: docker compose up -d --build app

      - name: Verify container is running
        run: |
          sleep 10
          STATUS=$(docker inspect --format='{{.State.Status}}' accounting-bot-app-1 2>/dev/null || echo "not_found")
          echo "Container status: $STATUS"
          if [ "$STATUS" != "running" ]; then
            docker compose logs --tail=40 app
            exit 1
          fi
