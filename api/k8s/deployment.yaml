apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-api
  namespace: accounting-bot
  labels:
    app: accounting-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounting-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: accounting-api
    spec:
      # The schedulers finish a run in flight (up to 25 s) before the pod stops.
      terminationGracePeriodSeconds: 45
      containers:
        - name: accounting-api
          image: ghcr.io/destinym01/accounting-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: MONGO_URI
              value: "mongodb://mongodb-svc:27017/accbot?directConnection=true"
            - name: BOSS_USER_ID
              valueFrom:
                secretKeyRef:
                  name: accounting-bot-secret
                  key: BOSID
            - name: AUTHENTIK_ISSUER
              value: "https://auth.andujaronline.uk/application/o/bot-angular-auth/"
            - name: AUTHENTIK_JWKS_URI
              value: "https://auth.andujaronline.uk/application/o/bot-angular-auth/jwks/"
            - name: CORS_ORIGIN
              value: "https://bot.andujaronline.uk"
            # The web app's OIDC client id (public: it ships in the web bundle).
            # Tokens issued to any other Authentik application are refused.
            - name: AUTHENTIK_CLIENT_ID
              value: "DFlVNYRNAW6gpRai7lTVa0sVcNEgnylA9ESOU6qA"
            # The owner's Authentik user id (the token's sub). Until it's set,
            # the api refuses everyone and logs the id of whoever tried.
            - name: OWNER_SUB
              valueFrom:
                secretKeyRef:
                  name: accounting-bot-secret
                  key: OWNER_SUB
                  optional: true
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: accounting-bot-secret
                  key: MISTRAL_API_KEY
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: accounting-bot-secret
                  key: GMAIL_USER
                  optional: true
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounting-bot-secret
                  key: GMAIL_APP_PASSWORD
                  optional: true
            - name: INGEST_MAILBOX
              value: "Banks"
            - name: INGEST_POLL_CRON
              value: "*/10 * * * *"
            # report: count and log bank mail Gmail couldn't verify, but book it.
            # enforce: list it as unreadable instead. Switch once Settings shows
            # none unverified for every bank.
            - name: MAIL_VERIFY
              value: "report"
            # The next three are user-specific: real account digits and a
            # deploy-time timestamp. This repository is public, so they live in
            # the Secret, never in this manifest. optional: true only keeps the
            # pod starting before the keys exist. These are starting values only:
            # a value saved on the Settings page overrides the Secret's for
            # OWN_ACCOUNT_IDENTIFIERS and OWN_CASH_ACCOUNTS, and once saved,
            # later changes here stop applying to it.
            #
            # Their absence does NOT make the ingester inert — only missing
            # GMAIL_USER/GMAIL_APP_PASSWORD does. Without OWN_CASH_ACCOUNTS every
            # transfer is booked as an expense that moves the balance; without
            # INGEST_START_AT the first check reads the last 24h of mail. Set
            # all three in the Secret BEFORE adding the Gmail credentials.
            - name: INGEST_START_AT
              valueFrom:
                secretKeyRef:
                  name: accounting-bot-secret
                  key: INGEST_START_AT
                  optional: true
            - name: OWN_ACCOUNT_IDENTIFIERS
              valueFrom:
                secretKeyRef:
                  name: accounting-bot-secret
                  key: OWN_ACCOUNT_IDENTIFIERS
                  optional: true
            - name: OWN_CASH_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: accounting-bot-secret
                  key: OWN_CASH_ACCOUNTS
                  optional: true
            # Optional: where the weekly digest and monthly summary go. Unset,
            # they go to GMAIL_USER. In the Secret, never here: the repo is public.
            # This is a starting value only: a value saved on the Settings page
            # overrides it, and once saved, later changes here stop applying to it.
            - name: REPORT_TO
              valueFrom:
                secretKeyRef:
                  name: accounting-bot-secret
                  key: REPORT_TO
                  optional: true
            - name: USD_DOP_RATE
              value: "60"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
