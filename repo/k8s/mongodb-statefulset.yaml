apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: accounting-bot
  labels:
    app: mongodb
spec:
  serviceName: mongodb-svc   # must match the headless-capable Service name
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0   # Kubernetes default — explicit here to prevent ArgoCD drift
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:5.0.33
          # A fixed WiredTiger cache instead of the default (at least 256MB,
          # alongside a larger memory overhead on newer versions). The image's
          # entrypoint puts mongod in front of arguments that start with '-'.
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: accbot
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            # The request stays at 256Mi: mongodb-0 can only run on the node
            # holding its volume, and a bigger request could leave it Pending
            # there. The limit is what guards against being killed for memory.
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          # TCP checks work the same on every MongoDB version (6.0+ images have
          # no legacy mongo shell) and cost nothing, where starting mongosh
          # every few seconds would not. They prove the port answers, not that
          # queries work; the api's own errors would show a stuck database.
          # The startup probe gives a slow first start after an upgrade or a
          # recovery up to 10 minutes before the liveness check takes over.
          startupProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 20
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path   # K3s default StorageClass
        volumeMode: Filesystem         # Kubernetes default — explicit to prevent ArgoCD drift
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  namespace: accounting-bot
  labels:
    app: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
