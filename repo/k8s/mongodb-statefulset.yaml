apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: accounting-bot
  labels:
    app: mongodb
spec:
  serviceName: mongodb-svc   # must match the headless-capable Service name
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0   # Kubernetes default — explicit here to prevent ArgoCD drift
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:8.0.32
          # A fixed WiredTiger cache instead of the default (at least 256MB,
          # alongside a larger memory overhead on newer versions). The image's
          # entrypoint puts mongod in front of arguments that start with '-'.
          # A one-member replica set (rs0), which transactions need. Clients
          # connect with directConnection=true (see the postStart hook). The
          # oplog keeps its default size; it isn't preallocated and grows only
          # with writes (cap it online with replSetResizeOplog if needed).
          args: ["--wiredTigerCacheSizeGB", "0.25", "--replSet", "rs0"]
          lifecycle:
            # Initiates the replica set the first time mongod starts with
            # --replSet, and does nothing on every later start. The member is
            # the pod's own hostname, mongodb-0: it always resolves inside this
            # pod, while the Service has no endpoints until the pod is Ready.
            # db.hello() needs no login, so this keeps working once
            # authentication is on. It waits through a plain standalone (the
            # image's temporary init mongod on a fresh volume) for the real
            # --replSet mongod. It reports what it did in the container's log,
            # and always exits 0: a failing postStart would kill the container.
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    log() { echo "postStart: $*" > /proc/1/fd/1 2>/dev/null || true; }
                    local_uri="mongodb://127.0.0.1:27017/?directConnection=true&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000"
                    state=""
                    i=0
                    while [ "$i" -lt 60 ]; do
                      state=$(timeout 10 mongosh "$local_uri" --quiet --eval 'const h = db.hello(); print(h.setName ? "initiated" : (h.isreplicaset ? "uninitiated" : "standalone"))' 2>/dev/null) || state=""
                      case "$state" in initiated|uninitiated) break ;; esac
                      i=$((i + 1))
                      sleep 2
                    done
                    if [ "$state" = "uninitiated" ]; then
                      if timeout 30 mongosh "$local_uri" --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb-0:27017" }] })'; then
                        log "initiated replica set rs0 (member mongodb-0:27017)"
                      else
                        log "rs.initiate failed; initiate by hand or delete the pod to retry"
                      fi
                    elif [ "$state" = "initiated" ]; then
                      log "replica set already initiated"
                    else
                      log "mongod never reported a replica set member (last state: ${state:-no answer}); nothing done"
                    fi
                    exit 0
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: accbot
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            # The request stays at 256Mi: mongodb-0 can only run on the node
            # holding its volume, and a bigger request could leave it Pending
            # there. The limit is what guards against being killed for memory.
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          # TCP checks work the same on every MongoDB version (6.0+ images have
          # no legacy mongo shell) and cost nothing, where starting mongosh
          # every few seconds would not. They prove the port answers, not that
          # queries work; the api's own errors would show a stuck database.
          # The startup probe gives a slow first start after an upgrade or a
          # recovery up to 10 minutes before the liveness check takes over.
          startupProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 20
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path   # K3s default StorageClass
        volumeMode: Filesystem         # Kubernetes default — explicit to prevent ArgoCD drift
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  namespace: accounting-bot
  labels:
    app: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
