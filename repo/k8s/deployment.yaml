apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-bot
  namespace: accounting-bot
  labels:
    app: accounting-bot
  annotations:
    bot/polling-mode: "long-poll"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounting-bot
  # maxUnavailable: 0 ensures the old pod is never terminated before the new
  # one is ready, giving zero-downtime deploys. maxSurge: 1 allows a brief
  # overlap where both old and new pods are running — during that window both
  # call getUpdates, so a small number of messages may be processed twice.
  # Acceptable trade-off for a single-replica bot; keep replicas: 1.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: accounting-bot
    spec:
      # If the GHCR image is private, create an imagePullSecret first:
      #   kubectl create secret docker-registry ghcr-secret \
      #     --docker-server=ghcr.io \
      #     --docker-username=<github-user> \
      #     --docker-password=<PAT-with-read:packages> \
      #     -n accounting-bot
      # Then uncomment the block below:
      # imagePullSecrets:
      #   - name: ghcr-secret

      # Wait until api.telegram.org is reachable before starting the bot.
      # Without this, Telegraf's initial getMe call times out if the pod's
      # network stack isn't fully ready, crashing the container on startup.
      initContainers:
        - name: wait-for-network
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -sf --max-time 5 https://api.telegram.org; do
                echo "waiting for network / api.telegram.org...";
                sleep 2;
              done
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m

      containers:
        - name: accounting-bot
          image: ghcr.io/destinym01/accounting-bot:latest
          imagePullPolicy: Always   # always re-pull :latest on pod restart
          ports:
            - name: http
              containerPort: 3000
          # Pull all secrets from the Secret object
          envFrom:
            - secretRef:
                name: accounting-bot-secret
          # Override MONGO_URI to the in-cluster service regardless of the
          # value set in the Secret, so the bot always talks to the StatefulSet.
          env:
            - name: PORT
              value: "3000"
            - name: MONGO_URI
              value: "mongodb://mongodb-svc:27017/accbot"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          # Health endpoint: GET /HealthChecks → { detail: "ok", result: "working" }
          livenessProbe:
            httpGet:
              path: /HealthChecks
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /HealthChecks
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
