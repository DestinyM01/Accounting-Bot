# ⚠️  PLACEHOLDER VALUES — do NOT commit real secrets to git.
# Recommended: seal this with Sealed Secrets or replace it with an
# ExternalSecrets / Vault integration before going to production.
# For a quick start you can also apply real values with:
#   kubectl create secret generic accounting-bot-secret \
#     --from-env-file=.env -n accounting-bot --dry-run=client -o yaml \
#   | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: accounting-bot-secret
  namespace: accounting-bot
type: Opaque
stringData:
  TELEGRAM_TOKEN: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  BOSID: "REPLACE_ME"
  CRON_TIMEZONE: "America/Santo_Domingo"
  CRON_SCHEDULE: "47 15 * * *"
  USDT: "REPLACE_ME"
  BTC: "REPLACE_ME"
  ETH: "REPLACE_ME"
  LTC: "REPLACE_ME"
  MONO: "REPLACE_ME"
  # MONGO_URI is set directly in the Deployment env to always use the
  # in-cluster service address, overriding anything here.
  MONGO_URI: "mongodb://mongodb-svc:27017/accbot"
