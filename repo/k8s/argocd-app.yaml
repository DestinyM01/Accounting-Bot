# Apply this manifest to the ArgoCD namespace on the cluster once:
#   kubectl apply -f k8s/argocd-app.yaml -n argocd
# After that ArgoCD owns everything else in k8s/ automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: accounting-bot
  namespace: argocd
  annotations:
    # Compare through the API server (a dry-run server-side apply) instead of
    # Argo's own client-side diff. The API server fills in defaults the
    # manifests leave out, such as the apiVersion, kind and status.phase
    # inside the MongoDB StatefulSet's volumeClaimTemplates, which otherwise
    # showed it OutOfSync forever. Pairs with ServerSideApply=true below.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    # Tells ArgoCD to clean up all managed resources when this Application
    # is deleted (cascade delete). Remove if you prefer manual cleanup.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/DestinyM01/Accounting-Bot
    targetRevision: main
    path: repo/k8s/

  destination:
    server: https://kubernetes.default.svc
    namespace: accounting-bot

  syncPolicy:
    automated:
      prune: true       # delete resources removed from git
      selfHeal: true    # revert any manual kubectl edits automatically
    syncOptions:
      - CreateNamespace=true   # create accounting-bot namespace if absent
      - ServerSideApply=true   # avoids annotation size limits on large manifests
    retry:
      limit: 3
      backoff:
        duration: 10s
        maxDuration: 3m
        factor: 2
