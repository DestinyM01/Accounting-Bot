<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AccBot</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Applies the saved theme choice before the app (and its stylesheet) loads, so the page
      // never flashes the wrong theme. ThemeService (core/ui/theme.service.ts) is still the
      // source of truth afterwards — same key, same values, this just runs first.
      (function () {
        try {
          var mode = localStorage.getItem('accbot.theme');
          if (mode === 'dark' || mode === 'light') document.documentElement.dataset['theme'] = mode;
        } catch (e) {
          // Storage can throw (private mode, blocked cookies): fall back to the system theme.
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
