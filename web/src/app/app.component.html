<div class="shell">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><mat-icon>account_balance</mat-icon></div>
      <div class="brand-text">
        <span class="brand-name">AccBot</span>
        <span class="brand-sub">Personal Finance</span>
      </div>
    </div>

    <ul class="nav-list">
      @for (item of navItems; track item.path) {
        <li>
          <a class="nav-item"
             [routerLink]="item.path"
             routerLinkActive="active">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="sidebar-footer">
      <div class="avatar">{{ initials }}</div>
      <span class="footer-name">{{ userName }}</span>
      <button class="logout-btn" (click)="logout()" title="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </nav>

  <!-- Main area -->
  <div class="main">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-right">
        <button class="icon-btn"><mat-icon>notifications_none</mat-icon></button>
        <button class="icon-btn"><mat-icon>settings</mat-icon></button>
      </div>
    </header>

    <div class="content">
      <router-outlet />
    </div>
  </div>
</div>
