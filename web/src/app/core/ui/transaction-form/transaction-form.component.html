@if (open) {
  <div class="tf-scrim" (click)="dismiss()" aria-hidden="true"></div>
  <div #panel class="tf-panel" role="dialog" aria-modal="true"
       [attr.aria-label]="mode === 'edit' ? 'Edit transaction' : 'New transaction'"
       (keydown)="onPanelKeydown($event)">
    <div class="tf-header">
      <h2>{{ mode === 'edit' ? 'Edit transaction' : 'New transaction' }}</h2>
      <button class="btn btn--icon" type="button" (click)="dismiss()" aria-label="Close"><app-icon name="x" /></button>
    </div>

    <div class="tf-body">
      @if (mode === 'create') {
        <div class="seg tf-type" role="radiogroup" aria-label="Type">
          @for (opt of typeOptions; track opt.value; let i = $index) {
            <button type="button" role="radio" [id]="typeOptionId(opt)" class="seg-opt"
                    [class.selected]="opt.value === type"
                    [attr.aria-checked]="opt.value === type"
                    [tabindex]="typeTabIndex(opt)"
                    (click)="selectType(opt.value)"
                    (keydown)="onTypeKeydown($event, i)">
              <app-icon [name]="opt.icon" [size]="16" /> {{ opt.label }}
            </button>
          }
        </div>
      }

      <label class="field">
        <span>Amount</span>
        <input #firstField class="tf-amount" type="number" min="0.01" step="0.01" inputmode="decimal" [(ngModel)]="amount" placeholder="0.00" />
      </label>
      <label class="field">
        <span>Name</span>
        <input type="text" [(ngModel)]="name" placeholder="What was it?" />
      </label>
      <label class="field">
        <span>Category</span>
        <select [(ngModel)]="category">
          @for (cat of categories; track cat) { <option [value]="cat">{{ cat | titlecase }}</option> }
        </select>
      </label>
      <label class="field">
        <span>Date</span>
        <input type="date" [(ngModel)]="date" />
      </label>

      @if (error) {
        <p class="error-inline" role="alert"><app-icon name="alert-circle" [size]="16" />{{ error }}</p>
      }
    </div>

    <div class="tf-footer">
      <button type="button" class="btn btn--ghost" [disabled]="saving" (click)="dismiss()">Cancel</button>
      <button type="button" class="btn btn--primary" [disabled]="!valid || saving" (click)="save()">
        <app-icon [name]="saving ? 'hourglass' : 'check'" />
        {{ saving ? 'Saving…' : (mode === 'edit' ? 'Save changes' : 'Add') }}
      </button>
    </div>
  </div>
}
