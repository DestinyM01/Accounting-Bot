server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing — serve index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* calls to the NestJS API service (in-cluster, no tunnel)
    location /api/ {
        proxy_pass         http://accounting-api-svc:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header  Authorization;
    }

    # Serve the OIDC silent-renew page directly (must not be caught by /api proxy)
    location = /silent-renew.html {
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
